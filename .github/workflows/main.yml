          async function sync() {
            try {
              console.log('');
              console.log('======================================');
              console.log('FOOTBALL SYNC START');
              console.log('======================================');

              const today = getBaghdadDate();
              const yesterday = addDays(today, -1);
              const tomorrow = addDays(today, 1);

              console.log(`Baghdad Date: ${today}`);
              console.log(`Yesterday: ${yesterday}`);
              console.log(`Tomorrow: ${tomorrow}`);

              // 1. تحديث المباريات المباشرة
              console.log('');
              console.log('LIVE MATCHES UPDATE START');
              const liveResult = await fetchAPI(`${API_BASE}/fixtures?live=all&timezone=${TIMEZONE}`);
              await saveFixtures(liveResult);

              // 2. تحديث مباريات الأمس
              console.log('');
              console.log('YESTERDAY UPDATE START');
              const yesterdayResult = await fetchAPI(`${API_BASE}/fixtures?date=${yesterday}&timezone=${TIMEZONE}`);
              await saveFixtures(yesterdayResult);

              // 3. تحديث مباريات اليوم
              console.log('');
              console.log('TODAY UPDATE START');
              const todayResult = await fetchAPI(`${API_BASE}/fixtures?date=${today}&timezone=${TIMEZONE}`);
              await saveFixtures(todayResult);

              // 4. تحديث مباريات الغد
              console.log('');
              console.log('TOMORROW UPDATE START');
              const tomorrowResult = await fetchAPI(`${API_BASE}/fixtures?date=${tomorrow}&timezone=${TIMEZONE}`);
              await saveFixtures(tomorrowResult);

              // 5. تنظيف البيانات القديمة
              await cleanupOldMatches();

              console.log('');
              console.log('======================================');
              console.log('SYNC COMPLETED SUCCESSFULLY');
              console.log('======================================');
              process.exit(0);

            } catch (error) {
              console.error('');
              console.error('======================================');
              console.error('SYNC ERROR');
              console.error(error.message);
              console.error('======================================');
              process.exit(1);
            }
          }
