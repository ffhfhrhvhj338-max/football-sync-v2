name: Football API Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios firebase-admin

      - name: Create Sync Script
        run: |

          cat << 'EOF' > sync.js

          const axios = require('axios');
          const admin = require('firebase-admin');

          // =====================================================
          // FIREBASE
          // =====================================================

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount),

            databaseURL:
              process.env.FIREBASE_DATABASE_URL
          });

          const db = admin.database();


          // =====================================================
          // API FOOTBALL
          // =====================================================

          const API_BASE =
            'https://v3.football.api-sports.io';

          const headers = {
            'x-apisports-key':
              process.env.API_FOOTBALL_KEY
          };


          // =====================================================
          // توقيت بغداد / العراق
          // UTC +3
          // =====================================================

          const BAGHDAD_OFFSET = 3;


          function getBaghdadNow() {

            const now = new Date();

            const utc =
              now.getTime() +
              now.getTimezoneOffset() * 60000;

            return new Date(
              utc +
              BAGHDAD_OFFSET * 60 * 60000
            );
          }


          function formatDate(date) {

            return date
              .toISOString()
              .substring(0, 10);
          }


          // =====================================================
          // الحالات
          // =====================================================

          const LIVE_STATUSES = new Set([
            '1H',
            'HT',
            '2H',
            'ET',
            'P',
            'LIVE'
          ]);


          const FINISHED_STATUSES = new Set([
            'FT',
            'AET',
            'PEN',
            'CANC',
            'ABD',
            'AWD',
            'WO'
          ]);


          // =====================================================
          // الدوريات المطلوبة
          // =====================================================

          const TOP_LEAGUES = new Set([
            2,
            39,
            140,
            135,
            78,
            61,
            307
          ]);


          // =====================================================
          // REQUEST
          // =====================================================

          async function fetchAPI(url) {

            for (let attempt = 1; attempt <= 3; attempt++) {

              try {

                console.log(
                  `API Request ${attempt}: ${url}`
                );

                const response =
                  await axios.get(
                    url,
                    {
                      headers: headers,
                      timeout: 15000
                    }
                  );

                return response.data;

              } catch (error) {

                console.log(
                  `Request failed: ${error.message}`
                );

                if (attempt === 3) {
                  throw error;
                }

                await new Promise(
                  resolve =>
                    setTimeout(resolve, 2000)
                );
              }
            }
          }


          // =====================================================
          // تحديد القسم
          // =====================================================

          function getSection(item) {

            if (
              !item ||
              !item.fixture ||
              !item.fixture.status
            ) {

              return 'matches';
            }


            const status =
              item.fixture.status.short;


            if (
              LIVE_STATUSES.has(status)
            ) {

              return 'live';
            }


            if (
              FINISHED_STATUSES.has(status)
            ) {

              return 'finished';
            }


            return 'matches';
          }


          // =====================================================
          // فحص الدوري
          // =====================================================

          function allowedLeague(item) {

            try {

              const leagueId =
                Number(item.league.id);

              return TOP_LEAGUES.has(
                leagueId
              );

            } catch (e) {

              return false;
            }
          }


          // =====================================================
          // تفاصيل المباريات المباشرة
          // =====================================================

          async function addLiveDetails(item) {

            const fixtureId =
              item.fixture.id;


            // الأحداث
            try {

              const events =
                await fetchAPI(
                  `${API_BASE}/fixtures/events?fixture=${fixtureId}`
                );

              item.events =
                events.response || [];

            } catch (e) {

              console.log(
                `Events error ${fixtureId}`
              );

              item.events = [];
            }


            // التشكيلات
            try {

              const lineups =
                await fetchAPI(
                  `${API_BASE}/fixtures/lineups?fixture=${fixtureId}`
                );

              item.lineups =
                lineups.response || [];

            } catch (e) {

              console.log(
                `Lineups error ${fixtureId}`
              );

              item.lineups = [];
            }
          }


          // =====================================================
          // نقل المباراة للقسم الصحيح
          // =====================================================

          async function saveFixture(item) {

            if (
              !item ||
              !item.fixture ||
              !item.fixture.id
            ) {

              return;
            }


            const fixtureId =
              String(item.fixture.id);


            // إذا الدوري غير مطلوب
            if (
              !allowedLeague(item)
            ) {

              return;
            }


            const section =
              getSection(item);


            const status =
              item.fixture.status &&
              item.fixture.status.short
                ? item.fixture.status.short
                : '';


            console.log(
              `Fixture ${fixtureId} | Status: ${status} | Section: ${section}`
            );


            // =================================================
            // LIVE
            // =================================================

            if (section === 'live') {

              await addLiveDetails(item);


              await db
                .ref(`live/${fixtureId}`)
                .set(item);


              await db
                .ref(`matches/${fixtureId}`)
                .remove();


              await db
                .ref(`finished/${fixtureId}`)
                .remove();


              return;
            }


            // =================================================
            // FINISHED
            // =================================================

            if (section === 'finished') {

              await db
                .ref(`finished/${fixtureId}`)
                .set(item);


              await db
                .ref(`live/${fixtureId}`)
                .remove();


              await db
                .ref(`matches/${fixtureId}`)
                .remove();


              return;
            }


            // =================================================
            // NOT STARTED
            // =================================================

            await db
              .ref(`matches/${fixtureId}`)
              .set(item);


            await db
              .ref(`live/${fixtureId}`)
              .remove();


            await db
              .ref(`finished/${fixtureId}`)
              .remove();
          }


          // =====================================================
          // تنظيف LIVE القديم
          //
          // إذا بقيت مباراة قديمة داخل live
          // وكانت حالتها ليست LIVE فعليًا
          // نحذفها من live.
          // =====================================================

          async function cleanupLive() {

            console.log(
              'Cleaning old LIVE matches...'
            );


            const snapshot =
              await db
                .ref('live')
                .once('value');


            const updates = {};


            snapshot.forEach(
              child => {

                const item =
                  child.val();


                if (
                  !item ||
                  !item.fixture ||
                  !item.fixture.status
                ) {

                  updates[
                    `live/${child.key}`
                  ] = null;

                  return;
                }


                const status =
                  item.fixture.status.short;


                if (
                  !LIVE_STATUSES.has(status)
                ) {

                  updates[
                    `live/${child.key}`
                  ] = null;
                }

              }
            );


            if (
              Object.keys(updates).length > 0
            ) {

              await db
                .ref()
                .update(updates);
            }
          }


          // =====================================================
          // تنظيف matches القديمة
          // =====================================================

          async function cleanupMatches() {

            console.log(
              'Cleaning old matches...'
            );


            const snapshot =
              await db
                .ref('matches')
                .once('value');


            const updates = {};


            snapshot.forEach(
              child => {

                const item =
                  child.val();


                if (
                  !item ||
                  !item.fixture
                ) {

                  updates[
                    `matches/${child.key}`
                  ] = null;

                  return;
                }


                const status =
                  item.fixture.status &&
                  item.fixture.status.short
                    ? item.fixture.status.short
                    : '';


                // أي مباراة أصبحت منتهية
                // لا تبقى في matches

                if (
                  FINISHED_STATUSES.has(status)
                ) {

                  updates[
                    `matches/${child.key}`
                  ] = null;

                  return;
                }


                // أي مباراة قديمة جدًا
                // نحذفها

                if (
                  item.fixture.date
                ) {

                  const matchTime =
                    new Date(
                      item.fixture.date
                    ).getTime();


                  if (
                    !isNaN(matchTime)
                  ) {

                    const age =
                      Date.now() -
                      matchTime;


                    const TWO_DAYS =
                      2 *
                      24 *
                      60 *
                      60 *
                      1000;


                    if (
                      age > TWO_DAYS
                    ) {

                      updates[
                        `matches/${child.key}`
                      ] = null;
                    }
                  }
                }

              }
            );


            if (
              Object.keys(updates).length > 0
            ) {

              await db
                .ref()
                .update(updates);
            }
          }


          // =====================================================
          // تنظيف FINISHED القديمة
          // =====================================================

          async function cleanupFinished() {

            console.log(
              'Cleaning old finished matches...'
            );


            const snapshot =
              await db
                .ref('finished')
                .once('value');


            const updates = {};


            const TWO_DAYS =
              2 *
              24 *
              60 *
              60 *
              1000;


            snapshot.forEach(
              child => {

                const item =
                  child.val();


                if (
                  !item ||
                  !item.fixture ||
                  !item.fixture.date
                ) {

                  return;
                }


                const matchTime =
                  new Date(
                    item.fixture.date
                  ).getTime();


                if (
                  !isNaN(matchTime) &&
                  Date.now() - matchTime >
                    TWO_DAYS
                ) {

                  updates[
                    `finished/${child.key}`
                  ] = null;
                }

              }
            );


            if (
              Object.keys(updates).length > 0
            ) {

              await db
                .ref()
                .update(updates);
            }
          }


          // =====================================================
          // المزامنة الرئيسية
          // =====================================================

          async function sync() {

            try {

              console.log(
                '======================================'
              );

              console.log(
                'FOOTBALL SYNC START'
              );

              console.log(
                '======================================'
              );


              const baghdadNow =
                getBaghdadNow();


              const today =
                formatDate(
                  baghdadNow
                );


              const yesterdayDate =
                new Date(
                  baghdadNow
                );


              yesterdayDate.setDate(
                yesterdayDate.getDate() - 1
              );


              const yesterday =
                formatDate(
                  yesterdayDate
                );


              console.log(
                `Baghdad Date: ${today}`
              );


              console.log(
                `Yesterday: ${yesterday}`
              );


              // =================================================
              // API
              // =================================================

              const liveData =
                await fetchAPI(
                  `${API_BASE}/fixtures?live=all`
                );


              const todayData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${today}`
                );


              const yesterdayData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${yesterday}`
                );


              // =================================================
              // دمج المباريات بدون تكرار
              // =================================================

              const fixtures =
                new Map();


              if (
                liveData &&
                liveData.response
              ) {

                for (
                  const item
                  of liveData.response
                ) {

                  if (
                    item &&
                    item.fixture &&
                    item.fixture.id
                  ) {

                    fixtures.set(
                      item.fixture.id,
                      item
                    );
                  }
                }
              }


              if (
                todayData &&
                todayData.response
              ) {

                for (
                  const item
                  of todayData.response
                ) {

                  if (
                    item &&
                    item.fixture &&
                    item.fixture.id
                  ) {

                    fixtures.set(
                      item.fixture.id,
                      item
                    );
                  }
                }
              }


              if (
                yesterdayData &&
                yesterdayData.response
              ) {

                for (
                  const item
                  of yesterdayData.response
                ) {

                  if (
                    item &&
                    item.fixture &&
                    item.fixture.id
                  ) {

                    fixtures.set(
                      item.fixture.id,
                      item
                    );
                  }
                }
              }


              console.log(
                `Fixtures found: ${fixtures.size}`
              );


              // =================================================
              // حفظ
              // =================================================

              for (
                const item
                of fixtures.values()
              ) {

                try {

                  await saveFixture(
                    item
                  );

                } catch (error) {

                  console.log(
                    `Fixture error: ${
                      item.fixture
                        ? item.fixture.id
                        : 'unknown'
                    }`
                  );

                  console.log(
                    error.message
                  );
                }
              }


              // =================================================
              // تنظيف
              // =================================================

              await cleanupLive();

              await cleanupMatches();

              await cleanupFinished();


              console.log(
                '======================================'
              );

              console.log(
                'SYNC COMPLETED'
              );

              console.log(
                '======================================'
              );


              process.exit(0);

            } catch (error) {

              console.error(
                'SYNC ERROR'
              );

              console.error(
                error.message
              );

              process.exit(1);
            }
          }


          sync();

          EOF


      - name: Run Sync
        env:

          API_FOOTBALL_KEY:
            ${{ secrets.API_FOOTBALL_KEY }}

          FIREBASE_DATABASE_URL:
            ${{ secrets.FIREBASE_DATABASE_URL }}

          FIREBASE_SERVICE_ACCOUNT:
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          node sync.js
