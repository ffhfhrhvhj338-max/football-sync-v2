            WRITE FIREBASE
            ========================================================
            */

            console.log("");

            console.log(
              "📤 إرسال البيانات إلى Firebase..."
            );


            try {

              await firebaseRef.update(
                updates
              );

            } catch (error) {

              console.error(
                "❌ فشل تحديث Firebase"
              );

              console.error(
                error.stack ||
                error.message
              );

              process.exit(1);

            }


            /*
