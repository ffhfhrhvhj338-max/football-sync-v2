name: Football API Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios firebase-admin

      - name: Create Sync Script
        run: |

          cat << 'EOF' > sync.js

          const axios = require('axios');
          const admin = require('firebase-admin');

          // =====================================================
          // FIREBASE
          // =====================================================

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential:
              admin.credential.cert(serviceAccount),

            databaseURL:
              process.env.FIREBASE_DATABASE_URL
          });

          const db = admin.database();


          // =====================================================
          // API FOOTBALL
          // =====================================================

          const API_BASE =
            'https://v3.football.api-sports.io';

          const headers = {
            'x-apisports-key':
              process.env.API_FOOTBALL_KEY,

            'Accept':
              'application/json'
          };


          // =====================================================
          // إعدادات
          // =====================================================

          const TIMEZONE =
            'Asia/Baghdad';


          // =====================================================
          // الدوريات المطلوبة
          // =====================================================

          const TOP_LEAGUES = new Set([
            1,      // World Cup
            2,      // Champions League
            3,      // Europa League
            4,      // Euro Championship
            9,      // World Cup Women
            11,     // Friendlies
            15,     // FIFA Club World Cup
            39,     // Premier League
            61,     // Ligue 1
            78,     // Bundesliga
            135,    // Serie A
            140,    // La Liga
            307,    // Saudi Pro League
            848     // Conference League
          ]);


          // =====================================================
          // طلب API مع إعادة المحاولة
          // =====================================================

          async function fetchAPI(url) {

            for (
              let attempt = 1;
              attempt <= 3;
              attempt++
            ) {

              try {

                console.log(
                  `API Request ${attempt}: ${url}`
                );

                const response =
                  await axios.get(
                    url,
                    {
                      headers: headers,
                      timeout: 20000
                    }
                  );

                return response.data;

              } catch (error) {

                console.log(
                  `Request failed: ${error.message}`
                );

                if (
                  error.response &&
                  error.response.data
                ) {

                  console.log(
                    JSON.stringify(
                      error.response.data
                    )
                  );
                }

                if (
                  attempt === 3
                ) {

                  throw error;
                }

                await new Promise(
                  resolve =>
                    setTimeout(
                      resolve,
                      2000
                    )
                );
              }
            }
          }


          // =====================================================
          // تاريخ بغداد الحالي
          // =====================================================

          function getBaghdadDate() {

            const formatter =
              new Intl.DateTimeFormat(
                'en-CA',
                {
                  timeZone: TIMEZONE,
                  year: 'numeric',
                  month: '2-digit',
                  day: '2-digit'
                }
              );

            return formatter.format(
              new Date()
            );
          }


          // =====================================================
          // إضافة أو إنقاص يوم
          // =====================================================

          function addDays(
            dateString,
            days
          ) {

            const parts =
              dateString.split('-');

            const date =
              new Date(
                Date.UTC(
                  Number(parts[0]),
                  Number(parts[1]) - 1,
                  Number(parts[2])
                )
              );

            date.setUTCDate(
              date.getUTCDate() + days
            );

            return date
              .toISOString()
              .substring(0, 10);
          }


          // =====================================================
          // فحص الدوري
          // =====================================================

          function allowedLeague(item) {

            try {

              if (
                !item ||
                !item.league ||
                !item.league.id
              ) {

                return false;
              }

              const leagueId =
                Number(
                  item.league.id
                );

              return TOP_LEAGUES.has(
                leagueId
              );

            } catch (error) {

              return false;
            }
          }


          // =====================================================
          // إضافة الأحداث والتشكيلات
          // فقط للمباريات المباشرة
          // =====================================================

          async function addLiveDetails(item) {

            const fixtureId =
              item.fixture.id;


            // =================================================
            // EVENTS
            // =================================================

            try {

              const events =
                await fetchAPI(
                  `${API_BASE}/fixtures/events?fixture=${fixtureId}`
                );

              item.events =
                events &&
                events.response
                  ? events.response
                  : [];

            } catch (error) {

              console.log(
                `Events error: ${fixtureId}`
              );

              item.events = [];
            }


            // =================================================
            // LINEUPS
            // =================================================

            try {

              const lineups =
                await fetchAPI(
                  `${API_BASE}/fixtures/lineups?fixture=${fixtureId}`
                );

              item.lineups =
                lineups &&
                lineups.response
                  ? lineups.response
                  : [];

            } catch (error) {

              console.log(
                `Lineups error: ${fixtureId}`
              );

              item.lineups = [];
            }
          }


          // =====================================================
          // تحديد هل المباراة مباشرة
          // =====================================================

          function isLiveStatus(
            status
          ) {

            const LIVE_STATUSES =
              new Set([
                '1H',
                'HT',
                '2H',
                'ET',
                'P',
                'LIVE'
              ]);

            return LIVE_STATUSES.has(
              status
            );
          }


          // =====================================================
          // حفظ المباراة
          //
          // كل شيء داخل matches فقط
          // =====================================================

          async function saveFixture(item) {

            if (
              !item ||
              !item.fixture ||
              !item.fixture.id
            ) {

              return;
            }


            // =================================================
            // فلترة الدوري
            // =================================================

            if (
              !allowedLeague(item)
            ) {

              return;
            }


            const fixtureId =
              String(
                item.fixture.id
              );


            const status =
              item.fixture.status &&
              item.fixture.status.short
                ? item.fixture.status.short
                : '';


            console.log(
              `Saving ${fixtureId} | Status: ${status}`
            );


            // =================================================
            // إذا المباراة مباشرة
            //
            // نضيف الأحداث والتشكيلات
            // داخل نفس matches
            // =================================================

            if (
              isLiveStatus(status)
            ) {

              await addLiveDetails(
                item
              );
            }


            // =================================================
            // الحفظ النهائي
            //
            // لا live
            // لا finished
            // لا upcoming
            //
            // فقط matches
            // =================================================

            await db
              .ref(
                `matches/${fixtureId}`
              )
              .set(item);


            console.log(
              `Saved matches/${fixtureId}`
            );
          }


          // =====================================================
          // حذف البيانات القديمة غير الصحيحة
          //
          // نحذف فقط:
          // - العقد التالفة
          //
          // ولا نحذف FT
          // ولا نحذف المباريات القديمة
          // هنا.
          // =====================================================

          async function cleanupInvalidMatches() {

            console.log(
              'Checking matches...'
            );


            const snapshot =
              await db
                .ref('matches')
                .once('value');


            const updates = {};


            snapshot.forEach(
              child => {

                const item =
                  child.val();


                if (
                  !item ||
                  !item.fixture ||
                  !item.fixture.id
                ) {

                  updates[
                    `matches/${child.key}`
                  ] = null;

                  console.log(
                    `Removed invalid match: ${child.key}`
                  );
                }

              }
            );


            if (
              Object.keys(updates).length > 0
            ) {

              await db
                .ref()
                .update(updates);
            }
          }


          // =====================================================
          // المزامنة الرئيسية
          // =====================================================

          async function sync() {

            try {

              console.log(
                '======================================'
              );

              console.log(
                'FOOTBALL SYNC START'
              );

              console.log(
                '======================================'
              );


              // =================================================
              // تواريخ بغداد
              // =================================================

              const today =
                getBaghdadDate();


              const yesterday =
                addDays(
                  today,
                  -1
                );


              const tomorrow =
                addDays(
                  today,
                  1
                );


              console.log(
                `Yesterday: ${yesterday}`
              );

              console.log(
                `Today: ${today}`
              );

              console.log(
                `Tomorrow: ${tomorrow}`
              );


              // =================================================
              // جلب مباريات الأمس
              // =================================================

              const yesterdayData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${yesterday}&timezone=${TIMEZONE}`
                );


              // =================================================
              // جلب مباريات اليوم
              // =================================================

              const todayData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${today}&timezone=${TIMEZONE}`
                );


              // =================================================
              // جلب مباريات الغد
              // =================================================

              const tomorrowData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${tomorrow}&timezone=${TIMEZONE}`
                );


              // =================================================
              // جلب المباريات المباشرة
              //
              // مهم حتى تتحدث حالة المباراة أثناء اللعب
              // =================================================

              const liveData =
                await fetchAPI(
                  `${API_BASE}/fixtures?live=all&timezone=${TIMEZONE}`
                );


              // =================================================
              // دمج كل البيانات
              //
              // Map يمنع التكرار حسب fixture.id
              // =================================================

              const fixtures =
                new Map();


              function addFixtures(
                data
              ) {

                if (
                  !data ||
                  !data.response
                ) {

                  return;
                }


                for (
                  const item
                  of data.response
                ) {

                  if (
                    item &&
                    item.fixture &&
                    item.fixture.id
                  ) {

                    fixtures.set(
                      String(
                        item.fixture.id
                      ),
                      item
                    );
                  }
                }
              }


              // =================================================
              // الترتيب مهم:
              //
              // الأمس
              // اليوم
              // الغد
              // المباشر أخيرًا لتحديث النسخة
              // =================================================

              addFixtures(
                yesterdayData
              );

              addFixtures(
                todayData
              );

              addFixtures(
                tomorrowData
              );

              addFixtures(
                liveData
              );


              console.log(
                `Fixtures found: ${fixtures.size}`
              );


              // =================================================
              // حفظ جميع المباريات
              // =================================================

              for (
                const item
                of fixtures.values()
              ) {

                try {

                  await saveFixture(
                    item
                  );

                } catch (error) {

                  console.log(
                    `Fixture save error: ${
                      item.fixture &&
                      item.fixture.id
                        ? item.fixture.id
                        : 'unknown'
                    }`
                  );

                  console.log(
                    error.message
                  );
                }
              }


              // =================================================
              // تنظيف البيانات التالفة فقط
              // =================================================

              await cleanupInvalidMatches();


              console.log(
                '======================================'
              );

              console.log(
                'SYNC COMPLETED'
              );

              console.log(
                '======================================'
              );


              process.exit(0);

            } catch (error) {

              console.error(
                '======================================'
              );

              console.error(
                'SYNC ERROR'
              );

              console.error(
                error.message
              );

              if (
                error.response &&
                error.response.data
              ) {

                console.error(
                  JSON.stringify(
                    error.response.data
                  )
                );
              }

              console.error(
                '======================================'
              );


              process.exit(1);
            }
          }


          // =====================================================
          // START
          // =====================================================

          sync();

          EOF


      - name: Run Sync
        env:

          API_FOOTBALL_KEY:
            ${{ secrets.API_FOOTBALL_KEY }}

          FIREBASE_DATABASE_URL:
            ${{ secrets.FIREBASE_DATABASE_URL }}

          FIREBASE_SERVICE_ACCOUNT:
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          node sync.js
