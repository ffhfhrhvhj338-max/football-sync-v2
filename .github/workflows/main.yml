                10
              )
            ) {

              console.log(

                `${match.match_date} | ` +
                `${match.match_time} | ` +
                `${match.home_team_name} vs ` +
                `${match.away_team_name} | ` +
                `${match.league_name} | ` +
                `${match.status_text}`

              );

            }


            /*
