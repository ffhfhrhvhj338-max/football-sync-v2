name: Football API Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios firebase-admin

      - name: Create Sync Script
        run: |
          cat << 'EOF' > sync.js
          const axios = require('axios');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          if (!admin.apps.length) {
            admin.initializeApp({
              credential: admin.credential.cert(serviceAccount),
              databaseURL: process.env.FIREBASE_DATABASE_URL
            });
          }

          const db = admin.database();

          async function fetchWithRetry(url, headers, retries = 3, delay = 2000) {
            for (let i = 0; i < retries; i++) {
              try {
                const response = await axios.get(url, { headers, timeout: 10000 });
                return response.data;
              } catch (error) {
                if (i === retries - 1) throw error;
                await new Promise(res => setTimeout(res, delay));
              }
            }
          }

          async function syncFootballData() {
            const apiKey = process.env.API_FOOTBALL_KEY;
            const headers = {
              'x-apisports-key': apiKey
            };

            const d = new Date();
            const today = d.toISOString().split('T')[0];
            
            const y = new Date(d);
            y.setDate(y.getDate() - 1);
            const yesterday = y.toISOString().split('T')[0];

            try {
              console.log('Fetching live fixtures...');
              const liveData = await fetchWithRetry('https://v3.football.api-sports.io/fixtures?live=all', headers);
              
              console.log(`Fetching today fixtures (${today})...`);
              const todayData = await fetchWithRetry(`https://v3.football.api-sports.io/fixtures?date=${today}`, headers);

              console.log(`Fetching yesterday fixtures (${yesterday})...`);
              const yesterdayData = await fetchWithRetry(`https://v3.football.api-sports.io/fixtures?date=${yesterday}`, headers);

              const fixturesMap = new Map();

              if (yesterdayData.response) {
                yesterdayData.response.forEach(item => fixturesMap.set(item.fixture.id, item));
              }
              if (todayData.response) {
                todayData.response.forEach(item => fixturesMap.set(item.fixture.id, item));
              }
              if (liveData.response) {
                liveData.response.forEach(item => fixturesMap.set(item.fixture.id, item));
              }

              const fixtures = Array.from(fixturesMap.values());
              console.log(`Total unique fixtures to process: ${fixtures.length}`);

              for (const item of fixtures) {
                const fixtureId = item.fixture.id;
                
                try {
                  const lineupsData = await fetchWithRetry(`https://v3.football.api-sports.io/fixtures/lineups?fixture=${fixtureId}`, headers);
                  item.lineups = lineupsData.response || [];
                } catch (e) {
                  item.lineups = [];
                }

                try {
                  const eventsData = await fetchWithRetry(`https://v3.football.api-sports.io/fixtures/events?fixture=${fixtureId}`, headers);
                  item.events = eventsData.response || [];
                } catch (e) {
                  item.events = [];
                }

                await db.ref(`matches/${fixtureId}`).set(item);
                if (['1H', 'HT', '2H', 'ET', 'P', 'LIVE'].includes(item.fixture.status.short)) {
                  await db.ref(`live/${fixtureId}`).set(item);
                } else {
                  await db.ref(`live/${fixtureId}`).remove();
                }
              }

              console.log('Synchronization completed successfully!');
              process.exit(0);
            } catch (error) {
              console.error('Error during sync:', error.message);
              process.exit(1);
            }
          }

          syncFootballData();
          EOF

      - name: Run Sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync.js
