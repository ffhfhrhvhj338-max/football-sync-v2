name: Test Bzzoiro Static Data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test League and Teams
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          node <<'NODE'

          const https = require('https');

          const API_KEY = process.env.BZZOIRO_API_KEY;

          if (!API_KEY) {
            console.error("❌ BZZOIRO_API_KEY غير موجود");
            process.exit(1);
          }

          function request(path) {

            return new Promise((resolve, reject) => {

              const options = {
                hostname: 'sports.bzzoiro.com',
                path: path,
                method: 'GET',
                headers: {
                  'Authorization': `Token ${API_KEY}`,
                  'Accept': 'application/json'
                }
              };

              const req = https.request(options, res => {

                let data = '';

                res.on('data', chunk => {
                  data += chunk;
                });

                res.on('end', () => {

                  console.log(`\nHTTP ${res.statusCode} - ${path}`);

                  if (res.statusCode < 200 || res.statusCode >= 300) {

                    console.log(data.substring(0, 3000));

                    reject(
                      new Error(`HTTP ${res.statusCode}`)
                    );

                    return;
                  }

                  try {

                    resolve(JSON.parse(data));

                  } catch (error) {

                    console.log(data.substring(0, 3000));

                    reject(error);

                  }

                });

              });

              req.on('error', reject);

              req.end();

            });

          }


          (async () => {

            console.log("========================================");
            console.log(" BZZOIRO STATIC DATA TEST");
            console.log("========================================");


            // ========================================
            // IDs من مباراة Bahia vs Remo
            // ========================================

            const leagueId = 9;

            const homeTeamId = 166;

            const awayTeamId = 372;


            // ========================================
            // LEAGUE
            // ========================================

            console.log("");
            console.log("========================================");
            console.log(" LEAGUE DATA");
            console.log("========================================");

            const league = await request(
              `/api/v2/leagues/${leagueId}/`
            );

            console.log(
              JSON.stringify(league, null, 2)
            );


            // ========================================
            // HOME TEAM
            // ========================================

            console.log("");
            console.log("========================================");
            console.log(" HOME TEAM DATA");
            console.log("========================================");

            const homeTeam = await request(
              `/api/v2/teams/${homeTeamId}/`
            );

            console.log(
              JSON.stringify(homeTeam, null, 2)
            );


            // ========================================
            // AWAY TEAM
            // ========================================

            console.log("");
            console.log("========================================");
            console.log(" AWAY TEAM DATA");
            console.log("========================================");

            const awayTeam = await request(
              `/api/v2/teams/${awayTeamId}/`
            );

            console.log(
              JSON.stringify(awayTeam, null, 2)
            );


            // ========================================
            // IMAGE URLS
            // ========================================

            console.log("");
            console.log("========================================");
            console.log(" IMAGE URLS");
            console.log("========================================");

            console.log(
              "League Logo:"
            );

            console.log(
              `https://sports.bzzoiro.com/img/league/${leagueId}/`
            );

            console.log("");

            console.log(
              "Home Team Logo:"
            );

            console.log(
              `https://sports.bzzoiro.com/img/team/${homeTeamId}/`
            );

            console.log("");

            console.log(
              "Away Team Logo:"
            );

            console.log(
              `https://sports.bzzoiro.com/img/team/${awayTeamId}/`
            );


            console.log("");
            console.log("========================================");
            console.log(" TEST FINISHED");
            console.log("========================================");

          })().catch(error => {

            console.error("");
            console.error("❌ ERROR:");
            console.error(error.message);

            process.exit(1);

          });

          NODE
