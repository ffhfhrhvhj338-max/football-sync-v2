            SUCCESS
            ========================================================
            */

            console.log("");

            console.log(
              "================================================"
            );

            console.log(
              "✅ تمت المزامنة بنجاح"
            );

            console.log(
              "✅ Bzzoiro يعمل"
            );

            console.log(
              "✅ Firebase يعمل"
            );

            console.log(
              "✅ Goal TV data جاهزة"
            );

            console.log(
              "================================================"
            );


            /*
            ========================================================
            CLOSE FIREBASE
            ========================================================
            */

            try {

              await admin
                .app()
                .delete();

            } catch (error) {

              console.warn(
                "⚠️ تعذر إغلاق Firebase"
              );

            }


          })().catch(
            error => {

              console.error("");

              console.error(
