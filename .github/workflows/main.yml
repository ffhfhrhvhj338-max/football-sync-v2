name: Test Bzzoiro API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Bzzoiro
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          node <<'NODE'
          const https = require('https');

          const API_KEY = process.env.BZZOIRO_API_KEY;

          if (!API_KEY) {
            console.error("❌ BZZOIRO_API_KEY غير موجود");
            process.exit(1);
          }

          function request(path) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'sports.bzzoiro.com',
                path: path,
                method: 'GET',
                headers: {
                  'Authorization': `Token ${API_KEY}`,
                  'Accept': 'application/json'
                }
              };

              const req = https.request(options, res => {
                let data = '';

                res.on('data', chunk => {
                  data += chunk;
                });

                res.on('end', () => {
                  console.log(`\nHTTP ${res.statusCode} - ${path}`);

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    console.log(data.substring(0, 1000));
                    return reject(
                      new Error(`HTTP ${res.statusCode}`)
                    );
                  }

                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    console.log(data.substring(0, 1000));
                    reject(e);
                  }
                });
              });

              req.on('error', reject);
              req.end();
            });
          }

          function getDate(offset) {
            const d = new Date();

            d.setUTCDate(d.getUTCDate() + offset);

            return d.toISOString().substring(0, 10);
          }

          function extractEvents(data) {
            if (Array.isArray(data)) return data;

            if (Array.isArray(data.results)) return data.results;

            if (Array.isArray(data.events)) return data.events;

            if (Array.isArray(data.data)) return data.data;

            return [];
          }

          function value(obj, keys) {
            for (const key of keys) {
              if (
                obj &&
                obj[key] !== undefined &&
                obj[key] !== null
              ) {
                return obj[key];
              }
            }

            return '';
          }

          function printEvents(title, events) {
            console.log(`\n==============================`);
            console.log(`${title}`);
            console.log(`عدد المباريات: ${events.length}`);
            console.log(`==============================`);

            for (const event of events.slice(0, 20)) {

              const home =
                value(event, [
                  'home_team_name',
                  'home_team',
                  'home'
                ]);

              const away =
                value(event, [
                  'away_team_name',
                  'away_team',
                  'away'
                ]);

              const league =
                value(event, [
                  'league_name',
                  'competition_name',
                  'league'
                ]);

              const date =
                value(event, [
                  'date',
                  'match_date',
                  'start_time',
                  'datetime'
                ]);

              const status =
                value(event, [
                  'status',
                  'match_status'
                ]);

              console.log(
                `${league} | ${home} vs ${away} | ${date} | ${status}`
              );
            }
          }

          (async () => {

            console.log("================================");
            console.log(" BZZOIRO API TEST - GOAL TV");
            console.log("================================");

            const yesterday = getDate(-1);
            const today = getDate(0);
            const tomorrow = getDate(1);

            console.log(`\nYesterday : ${yesterday}`);
            console.log(`Today     : ${today}`);
            console.log(`Tomorrow  : ${tomorrow}`);

            // ----------------------------
            // أمس
            // ----------------------------

            try {
              const data = await request(
                `/api/v2/events/?date_from=${yesterday}&date_to=${yesterday}`
              );

              const events = extractEvents(data);

              printEvents(
                `أمس - ${yesterday}`,
                events
              );

            } catch (e) {
              console.error("❌ فشل اختبار أمس:", e.message);
            }

            // ----------------------------
            // اليوم
            // ----------------------------

            try {
              const data = await request(
                `/api/v2/events/?date_from=${today}&date_to=${today}`
              );

              const events = extractEvents(data);

              printEvents(
                `اليوم - ${today}`,
                events
              );

            } catch (e) {
              console.error("❌ فشل اختبار اليوم:", e.message);
            }

            // ----------------------------
            // غدًا
            // ----------------------------

            try {
              const data = await request(
                `/api/v2/events/?date_from=${tomorrow}&date_to=${tomorrow}`
              );

              const events = extractEvents(data);

              printEvents(
                `غدًا - ${tomorrow}`,
                events
              );

            } catch (e) {
              console.error("❌ فشل اختبار غدًا:", e.message);
            }

            // ----------------------------
            // LIVE
            // ----------------------------

            try {
              const data = await request(
                `/api/v2/events/live/`
              );

              const events = extractEvents(data);

              printEvents(
                "LIVE",
                events
              );

            } catch (e) {
              console.error("❌ فشل اختبار LIVE:", e.message);
            }

            console.log("\n================================");
            console.log(" انتهى الاختبار");
            console.log("================================");

          })();
          NODE
