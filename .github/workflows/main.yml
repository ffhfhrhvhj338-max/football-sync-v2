const axios = require('axios');
const admin = require('firebase-admin');


// =====================================================
// إعدادات
// =====================================================

const API_BASE = 'https://v3.football.api-sports.io';

const TIMEZONE = 'Asia/Baghdad';

const TOP_LEAGUES = new Set([
    1,
    2,
    3,
    4,
    9,
    11,
    15,
    39,
    61,
    78,
    135,
    140,
    307,
    848
]);

const LIVE_STATUSES = [
    '1H',
    'HT',
    '2H',
    'ET',
    'P',
    'LIVE'
];


// =====================================================
// التحقق من Secrets
// =====================================================

console.log('');
console.log('======================================');
console.log('CHECKING GITHUB SECRETS');
console.log('======================================');

if (!process.env.API_FOOTBALL_KEY) {
    throw new Error('API_FOOTBALL_KEY is missing');
}

if (!process.env.FIREBASE_DATABASE_URL) {
    throw new Error('FIREBASE_DATABASE_URL is missing');
}

if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
    throw new Error('FIREBASE_SERVICE_ACCOUNT is missing');
}

console.log('API_FOOTBALL_KEY: OK');
console.log('FIREBASE_DATABASE_URL: OK');
console.log('FIREBASE_SERVICE_ACCOUNT: OK');


// =====================================================
// Firebase
// =====================================================

let serviceAccount;

try {

    serviceAccount =
        JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
        );

} catch (error) {

    throw new Error(
        'FIREBASE_SERVICE_ACCOUNT is not valid JSON'
    );
}


admin.initializeApp({

    credential:
        admin.credential.cert(
            serviceAccount
        ),

    databaseURL:
        process.env.FIREBASE_DATABASE_URL

});


const db =
    admin.database();


console.log('Firebase Admin initialized');


// =====================================================
// API Headers
// =====================================================

const headers = {

    'x-apisports-key':
        process.env.API_FOOTBALL_KEY,

    'Accept':
        'application/json'

};


// =====================================================
// الإحصائيات
// =====================================================

const stats = {

    apiRequests: 0,

    apiReceived: 0,

    allowed: 0,

    saved: 0,

    saveErrors: 0,

    skippedLeagues: 0,

    invalid: 0,

    removed: 0

};


// =====================================================
// تاريخ بغداد
// =====================================================

function getBaghdadDate() {

    const formatter =
        new Intl.DateTimeFormat(
            'en-CA',
            {
                timeZone: TIMEZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }
        );

    return formatter.format(
        new Date()
    );
}


// =====================================================
// إضافة أيام
// =====================================================

function addDays(
    dateString,
    days
) {

    const parts =
        dateString.split('-');

    const date =
        new Date(
            Date.UTC(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            )
        );

    date.setUTCDate(
        date.getUTCDate() + days
    );

    return date
        .toISOString()
        .substring(0, 10);
}


// =====================================================
// تاريخ المباراة بتوقيت بغداد
// =====================================================

function getMatchBaghdadDate(
    timestamp
) {

    const ts =
        Number(timestamp);

    if (
        !Number.isFinite(ts) ||
        ts <= 0
    ) {
        return '';
    }

    const formatter =
        new Intl.DateTimeFormat(
            'en-CA',
            {
                timeZone: TIMEZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }
        );

    return formatter.format(
        new Date(ts * 1000)
    );
}


// =====================================================
// API Request
// =====================================================

async function fetchAPI(
    url
) {

    console.log('');
    console.log('--------------------------------------');
    console.log('API REQUEST');
    console.log(url);
    console.log('--------------------------------------');

    stats.apiRequests++;

    try {

        const response =
            await axios.get(
                url,
                {
                    headers: headers,
                    timeout: 30000
                }
            );


        if (
            !response.data
        ) {

            throw new Error(
                'API returned empty response'
            );
        }


        if (
            response.data.errors &&
            Object.keys(
                response.data.errors
            ).length > 0
        ) {

            throw new Error(
                'API errors: ' +
                JSON.stringify(
                    response.data.errors
                )
            );
        }


        const responseList =
            Array.isArray(
                response.data.response
            )
                ? response.data.response
                : [];


        console.log(
            `API RECEIVED: ${responseList.length}`
        );


        stats.apiReceived +=
            responseList.length;


        return {

            data:
                response.data,

            responseTime:
                Date.now()

        };


    } catch (error) {

        console.error('');
        console.error('API REQUEST FAILED');
        console.error(error.message);


        if (
            error.response &&
            error.response.data
        ) {

            console.error(
                JSON.stringify(
                    error.response.data
                )
            );
        }


        throw error;
    }
}


// =====================================================
// الدوري المسموح
// =====================================================

function allowedLeague(
    item
) {

    if (
        !item ||
        !item.league ||
        item.league.id == null
    ) {

        return false;
    }


    const leagueId =
        Number(
            item.league.id
        );


    return TOP_LEAGUES.has(
        leagueId
    );
}


// =====================================================
// تصحيح LIVE القديمة
// =====================================================

function normalizeStatus(
    item
) {

    if (
        !item ||
        !item.fixture ||
        !item.fixture.status
    ) {

        return;
    }


    let status =
        String(
            item.fixture.status.short || ''
        ).toUpperCase();


    const timestamp =
        Number(
            item.fixture.timestamp
        );


    if (
        LIVE_STATUSES.includes(status) &&
        timestamp > 0
    ) {

        const minutesSinceStart =
            Math.floor(
                (
                    Math.floor(Date.now() / 1000) -
                    timestamp
                ) / 60
            );


        if (
            minutesSinceStart >= 130
        ) {

            console.log(
                `STALE LIVE -> FT | ${item.fixture.id}`
            );


            status = 'FT';


            item.fixture.status.short =
                'FT';

            item.fixture.status.long =
                'Match Finished';

            item.fixture.status.elapsed =
                90;
        }
    }


    item.fixture.status.short =
        status;
}


// =====================================================
// حفظ مباراة
// =====================================================

async function saveFixture(
    item
) {

    if (
        !item ||
        !item.fixture ||
        !item.fixture.id
    ) {

        stats.invalid++;

        return;
    }


    const fixtureId =
        String(
            item.fixture.id
        );


    // -----------------------------------------
    // فحص الدوري
    // -----------------------------------------

    if (
        !allowedLeague(item)
    ) {

        stats.skippedLeagues++;

        return;
    }


    stats.allowed++;


    // -----------------------------------------
    // تصحيح الحالة
    // -----------------------------------------

    normalizeStatus(
        item
    );


    const matchDate =
        getMatchBaghdadDate(
            item.fixture.timestamp
        );


    const status =
        item.fixture.status &&
        item.fixture.status.short
            ? String(
                item.fixture.status.short
            ).toUpperCase()
            : '';


    const elapsed =
        item.fixture.status &&
        item.fixture.status.elapsed != null
            ? item.fixture.status.elapsed
            : '';


    console.log(
        `SAVE -> ID=${fixtureId}` +
        ` | DATE=${matchDate}` +
        ` | STATUS=${status}` +
        ` | ELAPSED=${elapsed}`
    );


    try {

        await db
            .ref(
                `matches/${fixtureId}`
            )
            .set(
                item
            );


        stats.saved++;


        console.log(
            `FIREBASE SAVED -> matches/${fixtureId}`
        );


    } catch (error) {

        stats.saveErrors++;


        console.error(
            `FIREBASE SAVE ERROR -> ${fixtureId}`
        );


        console.error(
            error.message
        );


        // مهم:
        // نرمي الخطأ حتى يفشل GitHub
        throw error;
    }
}


// =====================================================
// حفظ مجموعة مباريات
// =====================================================

async function saveFixtures(
    result,
    source
) {

    if (
        !result ||
        !result.data ||
        !Array.isArray(
            result.data.response
        )
    ) {

        throw new Error(
            `${source}: invalid API response`
        );
    }


    const list =
        result.data.response;


    console.log('');
    console.log(
        `${source}: ${list.length} fixtures received`
    );


    for (
        const item
        of list
    ) {

        await saveFixture(
            item
        );
    }
}


// =====================================================
// اختبار Firebase
// =====================================================

async function testFirebase() {

    console.log('');
    console.log('======================================');
    console.log('FIREBASE WRITE TEST');
    console.log('======================================');


    const testRef =
        db.ref(
            '_sync_test'
        );


    const testData = {

        status:
            'OK',

        message:
            'GitHub can write to Firebase',

        time:
            new Date().toISOString()

    };


    try {

        await testRef.set(
            testData
        );


        console.log(
            'FIREBASE WRITE TEST: SUCCESS'
        );


        const check =
            await testRef.once(
                'value'
            );


        if (
            !check.exists()
        ) {

            throw new Error(
                'Firebase write completed but read-back failed'
            );
        }


        console.log(
            'FIREBASE READ TEST: SUCCESS'
        );


        await testRef.remove();


        console.log(
            'FIREBASE TEST DATA REMOVED'
        );


    } catch (error) {

        console.error(
            'FIREBASE CONNECTION TEST FAILED'
        );


        console.error(
            error.message
        );


        throw error;
    }
}


// =====================================================
// تنظيف المباريات القديمة
// =====================================================

async function cleanupOldMatches() {

    console.log('');
    console.log('======================================');
    console.log('CLEANUP START');
    console.log('======================================');


    const today =
        getBaghdadDate();


    const yesterday =
        addDays(
            today,
            -1
        );


    const tomorrow =
        addDays(
            today,
            1
        );


    const allowedDates =
        new Set([
            yesterday,
            today,
            tomorrow
        ]);


    console.log(
        `Allowed dates: ${yesterday}, ${today}, ${tomorrow}`
    );


    const snapshot =
        await db
            .ref('matches')
            .once('value');


    if (
        !snapshot.exists()
    ) {

        console.log(
            'Firebase matches is empty'
        );

        return;
    }


    const updates = {};


    snapshot.forEach(
        child => {

            const item =
                child.val();


            if (
                !item ||
                !item.fixture
            ) {

                updates[
                    `matches/${child.key}`
                ] = null;


                stats.removed++;

                return;
            }


            const matchDate =
                getMatchBaghdadDate(
                    item.fixture.timestamp
                );


            if (
                !allowedDates.has(
                    matchDate
                )
            ) {

                updates[
                    `matches/${child.key}`
                ] = null;


                stats.removed++;


                console.log(
                    `REMOVE OLD -> ${child.key} | ${matchDate}`
                );
            }
        }
    );


    if (
        Object.keys(updates).length > 0
    ) {

        await db
            .ref()
            .update(
                updates
            );


        console.log(
            `REMOVED: ${Object.keys(updates).length}`
        );


    } else {

        console.log(
            'NO OLD MATCHES'
        );
    }


    console.log(
        'CLEANUP COMPLETED'
    );
}


// =====================================================
// المزامنة الرئيسية
// =====================================================

async function sync() {

    console.log('');
    console.log('======================================');
    console.log('FOOTBALL SYNC START');
    console.log('======================================');


    const today =
        getBaghdadDate();


    const yesterday =
        addDays(
            today,
            -1
        );


    const tomorrow =
        addDays(
            today,
            1
        );


    console.log(
        `Baghdad Today: ${today}`
    );


    console.log(
        `Yesterday: ${yesterday}`
    );


    console.log(
        `Tomorrow: ${tomorrow}`
    );


    // =================================================
    // 1. اختبار Firebase
    // =================================================

    await testFirebase();


    // =================================================
    // 2. LIVE
    // =================================================

    console.log('');
    console.log('LIVE UPDATE');


    const liveResult =
        await fetchAPI(
            `${API_BASE}/fixtures?live=all&timezone=${TIMEZONE}`
        );


    await saveFixtures(
        liveResult,
        'LIVE'
    );


    // =================================================
    // 3. أمس
    // =================================================

    console.log('');
    console.log('YESTERDAY UPDATE');


    const yesterdayResult =
        await fetchAPI(
            `${API_BASE}/fixtures?date=${yesterday}&timezone=${TIMEZONE}`
        );


    await saveFixtures(
        yesterdayResult,
        'YESTERDAY'
    );


    // =================================================
    // 4. اليوم
    // =================================================

    console.log('');
    console.log('TODAY UPDATE');


    const todayResult =
        await fetchAPI(
            `${API_BASE}/fixtures?date=${today}&timezone=${TIMEZONE}`
        );


    await saveFixtures(
        todayResult,
        'TODAY'
    );


    // =================================================
    // 5. غداً
    // =================================================

    console.log('');
    console.log('TOMORROW UPDATE');


    const tomorrowResult =
        await fetchAPI(
            `${API_BASE}/fixtures?date=${tomorrow}&timezone=${TIMEZONE}`
        );


    await saveFixtures(
        tomorrowResult,
        'TOMORROW'
    );


    // =================================================
    // 6. تنظيف
    // =================================================

    await cleanupOldMatches();


    // =================================================
    // التقرير النهائي
    // =================================================

    console.log('');
    console.log('======================================');
    console.log('SYNC REPORT');
    console.log('======================================');


    console.log(
        `API REQUESTS: ${stats.apiRequests}`
    );


    console.log(
        `API RECEIVED: ${stats.apiReceived}`
    );


    console.log(
        `ALLOWED LEAGUES: ${stats.allowed}`
    );


    console.log(
        `SAVED TO FIREBASE: ${stats.saved}`
    );


    console.log(
        `SKIPPED LEAGUES: ${stats.skippedLeagues}`
    );


    console.log(
        `INVALID: ${stats.invalid}`
    );


    console.log(
        `SAVE ERRORS: ${stats.saveErrors}`
    );


    console.log(
        `REMOVED OLD: ${stats.removed}`
    );


    console.log('======================================');


    if (
        stats.saved === 0
    ) {

        throw new Error(
            'SYNC FINISHED BUT ZERO MATCHES WERE SAVED TO FIREBASE'
        );
    }


    if (
        stats.saveErrors > 0
    ) {

        throw new Error(
            'One or more Firebase save operations failed'
        );
    }


    console.log('');
    console.log(
        'SYNC COMPLETED SUCCESSFULLY'
    );
    console.log('');
}


// =====================================================
// START
// =====================================================

sync()
    .then(
        () => {

            process.exit(
                0
            );
        }
    )
    .catch(
        error => {

            console.error('');
            console.error('======================================');
            console.error('SYNC FAILED');
            console.error('======================================');
            console.error(
                error.stack ||
                error.message
            );
            console.error('======================================');


            process.exit(
                1
            );
        }
    );
