name: Football Sync - Bzzoiro to Firebase

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Sync Bzzoiro to Firebase

        env:

          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}

          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}

        run: |

          npm init -y >/dev/null 2>&1

          npm install firebase-admin@14.3.0 --no-save


          node --input-type=commonjs <<'NODE'

          const https = require("https");

          const {
            initializeApp,
            cert,
            deleteApp
          } = require("firebase-admin/app");

          const {
            getDatabase
          } = require("firebase-admin/database");


          console.log("");
          console.log("==============================================");
          console.log(" GOAL TV FOOTBALL SYNC");
          console.log(" BZZOIRO -> FIREBASE");
          console.log("==============================================");
          console.log("");


          /*
          ============================================================
          ENVIRONMENT
          ============================================================
          */

          const BZZOIRO_API_KEY =
            process.env.BZZOIRO_API_KEY;

          const FIREBASE_SERVICE_ACCOUNT =
            process.env.FIREBASE_SERVICE_ACCOUNT;

          const FIREBASE_DATABASE_URL =
            process.env.FIREBASE_DATABASE_URL;


          if (!BZZOIRO_API_KEY) {

            console.error(
              "ERROR: BZZOIRO_API_KEY غير موجود"
            );

            process.exit(1);

          }


          if (!FIREBASE_SERVICE_ACCOUNT) {

            console.error(
              "ERROR: FIREBASE_SERVICE_ACCOUNT غير موجود"
            );

            process.exit(1);

          }


          if (!FIREBASE_DATABASE_URL) {

            console.error(
              "ERROR: FIREBASE_DATABASE_URL غير موجود"
            );

            process.exit(1);

          }


          console.log(
            "OK: BZZOIRO_API_KEY"
          );

          console.log(
            "OK: FIREBASE_SERVICE_ACCOUNT"
          );

          console.log(
            "OK: FIREBASE_DATABASE_URL"
          );


          /*
          ============================================================
          FIREBASE SERVICE ACCOUNT
          ============================================================
          */

          let serviceAccount;


          try {

            serviceAccount =
              JSON.parse(
                FIREBASE_SERVICE_ACCOUNT
              );

          } catch (error) {

            console.error("");
            console.error(
              "ERROR: FIREBASE_SERVICE_ACCOUNT JSON غير صالح"
            );

            console.error(
              error.message
            );

            process.exit(1);

          }


          /*
          ============================================================
          FIREBASE APP
          ============================================================
          */

          let firebaseApp;

          let database;


          try {

            firebaseApp =
              initializeApp({

                credential:
                  cert(
                    serviceAccount
                  ),

                databaseURL:
                  FIREBASE_DATABASE_URL

              });


            database =
              getDatabase(
                firebaseApp
              );


            console.log("");
            console.log(
              "OK: Firebase initialized"
            );


          } catch (error) {

            console.error("");
            console.error(
              "ERROR: Firebase initialization failed"
            );

            console.error(
              error.stack ||
              error.message
            );

            process.exit(1);

          }


          /*
          ============================================================
          MAIN
          ============================================================
          */

          (async () => {


            /*
            ========================================================
            BZZOIRO REQUEST
            ========================================================
            */

            function bzzoiroRequest(path) {

              return new Promise(
                (resolve, reject) => {

                  const request =
                    https.request(

                      {

                        hostname:
                          "sports.bzzoiro.com",

                        path:
                          path,

                        method:
                          "GET",

                        headers: {

                          Authorization:
                            `Token ${BZZOIRO_API_KEY}`,

                          Accept:
                            "application/json"

                        }

                      },

                      response => {

                        let body = "";


                        response.on(
                          "data",
                          chunk => {

                            body += chunk;

                          }
                        );


                        response.on(
                          "end",
                          () => {

                            console.log(
                              `Bzzoiro ${response.statusCode}: ${path}`
                            );


                            if (
                              response.statusCode < 200 ||
                              response.statusCode >= 300
                            ) {

                              console.error(
                                body.substring(
                                  0,
                                  2000
                                )
                              );


                              reject(
                                new Error(
                                  `Bzzoiro HTTP ${response.statusCode}`
                                )
                              );

                              return;

                            }


                            try {

                              const json =
                                JSON.parse(
                                  body
                                );


                              resolve(
                                json
                              );


                            } catch (error) {

                              reject(
                                new Error(
                                  "Bzzoiro returned invalid JSON"
                                )
                              );

                            }

                          }
                        );

                      }

                    );


                  request.on(
                    "error",
                    error => {

                      reject(
                        error
                      );

                    }
                  );


                  request.end();

                }
              );

            }


            /*
            ========================================================
            EXTRACT EVENTS
            ========================================================
            */

            function extractEvents(data) {

              if (
                Array.isArray(data)
              ) {

                return data;

              }


              if (
                data &&
                Array.isArray(
                  data.results
                )
              ) {

                return data.results;

              }


              if (
                data &&
                Array.isArray(
                  data.events
                )
              ) {

                return data.events;

              }


              if (
                data &&
                Array.isArray(
                  data.data
                )
              ) {

                return data.data;

              }


              return [];

            }


            /*
            ========================================================
            BAGHDAD DATE
            ========================================================
            */

            function getBaghdadDate(
              offset
            ) {

              const now =
                new Date();


              const formatter =
                new Intl.DateTimeFormat(
                  "en-CA",
                  {

                    timeZone:
                      "Asia/Baghdad",

                    year:
                      "numeric",

                    month:
                      "2-digit",

                    day:
                      "2-digit"

                  }
                );


              const parts =
                formatter.formatToParts(
                  now
                );


              const year =
                Number(
                  parts.find(
                    x =>
                      x.type ===
                      "year"
                  ).value
                );


              const month =
                Number(
                  parts.find(
                    x =>
                      x.type ===
                      "month"
                  ).value
                );


              const day =
                Number(
                  parts.find(
                    x =>
                      x.type ===
                      "day"
                  ).value
                );


              const date =
                new Date(
                  Date.UTC(
                    year,
                    month - 1,
                    day
                  )
                );


              date.setUTCDate(
                date.getUTCDate() +
                offset
              );


              return date
                .toISOString()
                .substring(
                  0,
                  10
                );

            }


            const yesterday =
              getBaghdadDate(-1);


            const today =
              getBaghdadDate(0);


            const tomorrow =
              getBaghdadDate(1);


            console.log("");

            console.log(
              `Yesterday: ${yesterday}`
            );

            console.log(
              `Today: ${today}`
            );

            console.log(
              `Tomorrow: ${tomorrow}`
            );


            /*
            ========================================================
            UTC -> BAGHDAD
            ========================================================
            */

            function convertToBaghdad(
              isoDate
            ) {

              if (!isoDate) {

                return {

                  date: "",
                  time: ""

                };

              }


              const date =
                new Date(
                  isoDate
                );


              if (
                Number.isNaN(
                  date.getTime()
                )
              ) {

                return {

                  date:
                    String(
                      isoDate
                    ).substring(
                      0,
                      10
                    ),

                  time:
                    ""

                };

              }


              const dateFormatter =
                new Intl.DateTimeFormat(
                  "en-CA",
                  {

                    timeZone:
                      "Asia/Baghdad",

                    year:
                      "numeric",

                    month:
                      "2-digit",

                    day:
                      "2-digit"

                  }
                );


              const timeFormatter =
                new Intl.DateTimeFormat(
                  "en-US",
                  {

                    timeZone:
                      "Asia/Baghdad",

                    hour:
                      "2-digit",

                    minute:
                      "2-digit",

                    hour12:
                      true

                  }
                );


              const dateParts =
                dateFormatter.formatToParts(
                  date
                );


              const year =
                dateParts.find(
                  x =>
                    x.type ===
                    "year"
                ).value;


              const month =
                dateParts.find(
                  x =>
                    x.type ===
                    "month"
                ).value;


              const day =
                dateParts.find(
                  x =>
                    x.type ===
                    "day"
                ).value;


              const formattedDate =
                `${year}-${month}-${day}`;


              let formattedTime =
                timeFormatter.format(
                  date
                );


              formattedTime =
                formattedTime
                  .replace(
                    "AM",
                    "ص"
                  )
                  .replace(
                    "PM",
                    "م"
                  );


              return {

                date:
                  formattedDate,

                time:
                  formattedTime

              };

            }


            /*
            ========================================================
            STATUS
            ========================================================
            */

            function normalizeStatus(
              status
            ) {

              if (!status) {

                return "notstarted";

              }


              const value =
                String(status)
                  .toLowerCase()
                  .trim();


              if (
                value === "live" ||
                value === "inplay" ||
                value === "in_play"
              ) {

                return "live";

              }


              if (
                value === "finished" ||
                value === "ft" ||
                value === "fulltime"
              ) {

                return "finished";

              }


              if (
                value === "postponed"
              ) {

                return "postponed";

              }


              if (
                value === "cancelled" ||
                value === "canceled"
              ) {

                return "cancelled";

              }


              if (
                value === "notstarted" ||
                value === "not_started" ||
                value === "scheduled" ||
                value === "upcoming"
              ) {

                return "notstarted";

              }


              return value;

            }


            function getArabicStatus(
              status
            ) {

              const value =
                normalizeStatus(
                  status
                );


              if (
                value === "live"
              ) {

                return "مباشر";

              }


              if (
                value === "finished"
              ) {

                return "انتهت";

              }


              if (
                value === "postponed"
              ) {

                return "مؤجلة";

              }


              if (
                value === "cancelled"
              ) {

                return "ملغاة";

              }


              return "لم تبدأ";

            }


            /*
            ========================================================
            LEAGUE CACHE
            ========================================================
            */

            const leagueCache =
              new Map();


            async function getLeague(
              leagueId
            ) {

              if (!leagueId) {

                return {

                  id: "",
                  name: "",
                  country: ""

                };

              }


              const key =
                String(
                  leagueId
                );


              if (
                leagueCache.has(
                  key
                )
              ) {

                return leagueCache.get(
                  key
                );

              }


              try {

                const data =
                  await bzzoiroRequest(
                    `/api/v2/leagues/${leagueId}/`
                  );


                const league = {

                  id:
                    data.id ??
                    leagueId,

                  name:
                    data.name ??
                    "",

                  country:
                    data.country ??
                    ""

                };


                leagueCache.set(
                  key,
                  league
                );


                return league;


              } catch (error) {

                console.log(
                  `WARNING: league ${leagueId} unavailable`
                );


                const fallback = {

                  id:
                    leagueId,

                  name:
                    "",

                  country:
                    ""

                };


                leagueCache.set(
                  key,
                  fallback
                );


                return fallback;

              }

            }


            /*
            ========================================================
            GET DAY MATCHES
            ========================================================
            */

            async function getDayMatches(
              date
            ) {

              console.log("");

              console.log(
                `Getting matches: ${date}`
              );


              const events =
                [];


              let offset = 0;


              const limit = 200;


              while (true) {

                const path =
                  `/api/v2/events/?` +
                  `date_from=${date}` +
                  `&date_to=${date}` +
                  `&limit=${limit}` +
                  `&offset=${offset}`;


                const result =
                  await bzzoiroRequest(
                    path
                  );


                const page =
                  extractEvents(
                    result
                  );


                events.push(
                  ...page
                );


                console.log(
                  `Page offset ${offset}: ${page.length}`
                );


                if (
                  page.length < limit
                ) {

                  break;

                }


                offset +=
                  limit;


                if (
                  offset >
                  10000
                ) {

                  break;

                }

              }


              const unique =
                new Map();


              for (
                const event
                of events
              ) {

                if (
                  event &&
                  event.id
                ) {

                  unique.set(
                    String(
                      event.id
                    ),
                    event
                  );

                }

              }


              const result =
                Array.from(
                  unique.values()
                );


              console.log(
                `${date}: ${result.length} matches`
              );


              return result;

            }


            /*
            ========================================================
            MATCHES
            ========================================================
            */

            const matchesMap =
              new Map();


            async function addMatch(
              event,
              dayTitle
            ) {

              if (
                !event ||
                !event.id
              ) {

                return;

              }


              const id =
                String(
                  event.id
                );


              const converted =
                convertToBaghdad(
                  event.event_date
                );


              const league =
                await getLeague(
                  event.league_id
                );


              const homeId =
                event.home_team_id ??
                "";


              const awayId =
                event.away_team_id ??
                "";


              const status =
                normalizeStatus(
                  event.status
                );


              const homeScore =
                event.home_score ??
                null;


              const awayScore =
                event.away_score ??
                null;


              let score =
                "-";


              if (
                homeScore !== null &&
                awayScore !== null
              ) {

                score =
                  `${homeScore} - ${awayScore}`;

              }


              const match = {

                match_id:
                  id,

                event_id:
                  id,

                item_type:
                  "match",


                match_date:
                  converted.date,

                match_day:
                  dayTitle,

                day_title:
                  dayTitle,

                match_time:
                  converted.time,

                event_date:
                  event.event_date ??
                  "",


                match_status:
                  status,

                status:
                  status,

                status_text:
                  getArabicStatus(
                    status
                  ),

                current_minute:
                  event.current_minute ??
                  null,


                home_score:
                  homeScore,

                away_score:
                  awayScore,

                home_score_ht:
                  event.home_score_ht ??
                  null,

                away_score_ht:
                  event.away_score_ht ??
                  null,

                match_score:
                  score,


                league_id:
                  event.league_id ??
                  "",

                league_name:
                  league.name ??
                  "",

                league_country:
                  league.country ??
                  "",

                league_logo:
                  event.league_id
                    ? `https://sports.bzzoiro.com/img/league/${event.league_id}/`
                    : "",


                home_team_id:
                  homeId,

                home_team_name:
                  event.home_team ??
                  "",

                home_team_logo:
                  homeId
                    ? `https://sports.bzzoiro.com/img/team/${homeId}/`
                    : "",


                away_team_id:
                  awayId,

                away_team_name:
                  event.away_team ??
                  "",

                away_team_logo:
                  awayId
                    ? `https://sports.bzzoiro.com/img/team/${awayId}/`
                    : "",


                round_number:
                  event.round_number ??
                  null,

                round_name:
                  event.round_name ??
                  "",

                round_label:
                  event.round_label ??
                  "",

                stage:
                  event.stage ??
                  "",

                stage_name:
                  event.stage_name ??
                  "",


                venue_id:
                  event.venue_id ??
                  null,

                referee_id:
                  event.referee_id ??
                  null,


                show_day_header:
                  false,

                show_league_header:
                  false

              };


              matchesMap.set(
                id,
                match
              );

            }


            /*
            ========================================================
            YESTERDAY
            ========================================================
            */

            const yesterdayMatches =
              await getDayMatches(
                yesterday
              );


            for (
              const event
              of yesterdayMatches
            ) {

              await addMatch(
                event,
                "أمس"
              );

            }


            /*
            ========================================================
            TODAY
            ========================================================
            */

            const todayMatches =
              await getDayMatches(
                today
              );


            for (
              const event
              of todayMatches
            ) {

              await addMatch(
                event,
                "اليوم"
              );

            }


            /*
            ========================================================
            TOMORROW
            ========================================================
            */

            const tomorrowMatches =
              await getDayMatches(
                tomorrow
              );


            for (
              const event
              of tomorrowMatches
            ) {

              await addMatch(
                event,
                "غدًا"
              );

            }


            /*
            ========================================================
            LIVE
            ========================================================
            */

            console.log("");

            console.log(
              "Checking LIVE..."
            );


            try {

              const live =
                await bzzoiroRequest(
                  "/api/v2/events/live/"
                );


              const liveEvents =
                extractEvents(
                  live
                );


              console.log(
                `LIVE: ${liveEvents.length}`
              );


              for (
                const event
                of liveEvents
              ) {

                await addMatch(
                  event,
                  "اليوم"
                );

              }

            } catch (error) {

              console.log(
                "WARNING: LIVE unavailable"
              );

            }


            /*
            ========================================================
            SORT
            ========================================================
            */

            const matches =
              Array.from(
                matchesMap.values()
              );


            const order = {

              "أمس": 1,
              "اليوم": 2,
              "غدًا": 3

            };


            matches.sort(
              (a, b) => {

                const dayA =
                  order[
                    a.day_title
                  ] || 99;


                const dayB =
                  order[
                    b.day_title
                  ] || 99;


                if (
                  dayA !== dayB
                ) {

                  return dayA - dayB;

                }


                const dateA =
                  `${a.match_date} ${a.match_time}`;


                const dateB =
                  `${b.match_date} ${b.match_time}`;


                return dateA.localeCompare(
                  dateB
                );

              }
            );


            /*
            ========================================================
            HEADERS
            ========================================================
            */

            let previousDay =
              "";

            let previousLeague =
              "";


            for (
              const match
              of matches
            ) {

              if (
                match.day_title !==
                previousDay
              ) {

                match.show_day_header =
                  true;


                previousDay =
                  match.day_title;


                previousLeague =
                  "";

              }


              const leagueKey =
                `${match.league_id}_${match.league_name}`;


              if (
                leagueKey !==
                previousLeague
              ) {

                match.show_league_header =
                  true;


                previousLeague =
                  leagueKey;

              }

            }


            /*
            ========================================================
            FIREBASE
            ========================================================
            */

            const firebaseData =
              {};


            for (
              const match
              of matches
            ) {

              firebaseData[
                match.match_id
              ] = match;

            }


            console.log("");

            console.log(
              "Reading Firebase..."
            );


            const firebaseRoot =
              database.ref(
                "firebase"
              );


            let oldData =
              {};


            try {

              const snapshot =
                await firebaseRoot.once(
                  "value"
                );


              oldData =
                snapshot.val() ||
                {};

            } catch (error) {

              console.error(
                "ERROR: Firebase read failed"
              );


              console.error(
                error.stack ||
                error.message
              );


              process.exit(1);

            }


            /*
            ========================================================
            UPDATES
            ========================================================
            */

            const updates =
              {};


            for (
              const key
              of Object.keys(
                oldData
              )
            ) {

              const oldMatch =
                oldData[key];


              if (
                oldMatch &&
                (
                  oldMatch.match_id ||
                  oldMatch.item_type ===
                  "match"
                )
              ) {

                if (
                  !firebaseData[key]
                ) {

                  updates[key] =
                    null;

                }

              }

            }


            for (
              const match
              of matches
            ) {

              updates[
                match.match_id
              ] = match;

            }


            /*
            ========================================================
            WRITE
            ========================================================
            */

            console.log("");

            console.log(
              "Writing Firebase..."
            );


            try {

              await firebaseRoot.update(
                updates
              );

            } catch (error) {

              console.error(
                "ERROR: Firebase write failed"
              );


              console.error(
                error.stack ||
                error.message
              );


              process.exit(1);

            }


            /*
            ========================================================
            SUMMARY
            ========================================================
            */

            console.log("");

            console.log(
              "=============================================="
            );

            console.log(
              "SYNC SUMMARY"
            );

            console.log(
              "=============================================="
            );


            console.log(
              `Yesterday: ${yesterdayMatches.length}`
            );


            console.log(
              `Today: ${todayMatches.length}`
            );


            console.log(
              `Tomorrow: ${tomorrowMatches.length}`
            );


            console.log(
              `Total: ${matches.length}`
            );


            console.log(
              `Leagues: ${leagueCache.size}`
            );


            console.log("");

            console.log(
              "First 10 matches:"
            );


            for (
              const match
              of matches.slice(
                0,
                10
              )
            ) {

              console.log(

                `${match.match_date} | ` +
                `${match.match_time} | ` +
                `${match.home_team_name} vs ` +
                `${match.away_team_name} | ` +
                `${match.league_name} | ` +
                `${match.status_text}`

              );

            }


            /*
            ========================================================
            SUCCESS
            ========================================================
            */

            console.log("");

            console.log(
              "=============================================="
            );

            console.log(
              "SUCCESS"
            );

            console.log(
              "Bzzoiro -> Firebase"
            );

            console.log(
              "=============================================="
            );


            /*
            ========================================================
            DELETE FIREBASE APP
            ========================================================
            */

            try {

              await deleteApp(
                firebaseApp
              );

            } catch (error) {

              // لا نعتبر فشل الإغلاق فشلًا للمزامنة

            }


          })().catch(
            async error => {

              console.error("");

              console.error(
                "=============================================="
              );

              console.error(
                "SYNC FAILED"
              );

              console.error(
                "=============================================="
              );


              console.error(
                error &&
                error.stack
                  ? error.stack
                  : error
              );


              try {

                await deleteApp(
                  firebaseApp
                );

              } catch (e) {

              }


              process.exit(1);

            }
          );

          NODE
