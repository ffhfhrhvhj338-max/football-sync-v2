name: Football API Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios firebase-admin

      - name: Create Sync Script
        run: |

          cat << 'EOF' > sync.js

          const axios = require('axios');
          const admin = require('firebase-admin');


          // =====================================================
          // FIREBASE
          // =====================================================

          const serviceAccount =
            JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

          admin.initializeApp({
            credential:
              admin.credential.cert(
                serviceAccount
              ),

            databaseURL:
              process.env.FIREBASE_DATABASE_URL
          });

          const db =
            admin.database();


          // =====================================================
          // API FOOTBALL
          // =====================================================

          const API_BASE =
            'https://v3.football.api-sports.io';

          const headers = {

            'x-apisports-key':
              process.env.API_FOOTBALL_KEY,

            'Accept':
              'application/json'
          };


          // =====================================================
          // إعدادات
          // =====================================================

          const TIMEZONE =
            'Asia/Baghdad';


          // =====================================================
          // الدوريات المطلوبة
          // =====================================================

          const TOP_LEAGUES =
            new Set([

              1,
              2,
              3,
              4,
              9,
              11,
              15,
              39,
              61,
              78,
              135,
              140,
              307,
              848

            ]);


          // =====================================================
          // طلب API
          // =====================================================

          async function fetchAPI(url) {

            try {

              console.log(
                `API Request: ${url}`
              );

              const response =
                await axios.get(
                  url,
                  {
                    headers:
                      headers,

                    timeout:
                      20000
                  }
                );

              return response.data;

            } catch (error) {

              console.log(
                'API ERROR'
              );

              console.log(
                error.message
              );

              if (
                error.response &&
                error.response.data
              ) {

                console.log(
                  JSON.stringify(
                    error.response.data
                  )
                );
              }

              throw error;
            }
          }


          // =====================================================
          // تاريخ بغداد الحالي
          // =====================================================

          function getBaghdadDate() {

            const formatter =
              new Intl.DateTimeFormat(
                'en-CA',
                {
                  timeZone:
                    TIMEZONE,

                  year:
                    'numeric',

                  month:
                    '2-digit',

                  day:
                    '2-digit'
                }
              );

            return formatter.format(
              new Date()
            );
          }


          // =====================================================
          // الحصول على ساعة بغداد
          // =====================================================

          function getBaghdadHour() {

            const formatter =
              new Intl.DateTimeFormat(
                'en-US',
                {
                  timeZone:
                    TIMEZONE,

                  hour:
                    '2-digit',

                  hour12:
                    false
                }
              );

            return Number(
              formatter.format(
                new Date()
              )
            );
          }


          // =====================================================
          // إضافة أو إنقاص يوم
          // =====================================================

          function addDays(
            dateString,
            days
          ) {

            const parts =
              dateString.split('-');

            const date =
              new Date(
                Date.UTC(
                  Number(parts[0]),
                  Number(parts[1]) - 1,
                  Number(parts[2])
                )
              );

            date.setUTCDate(
              date.getUTCDate() +
              days
            );

            return date
              .toISOString()
              .substring(0, 10);
          }


          // =====================================================
          // فحص الدوري
          // =====================================================

          function allowedLeague(
            item
          ) {

            try {

              if (
                !item ||
                !item.league ||
                !item.league.id
              ) {

                return false;
              }

              const leagueId =
                Number(
                  item.league.id
                );

              return TOP_LEAGUES.has(
                leagueId
              );

            } catch (error) {

              return false;
            }
          }


          // =====================================================
          // حفظ مباراة
          // =====================================================

          async function saveFixture(
            item
          ) {

            if (
              !item ||
              !item.fixture ||
              !item.fixture.id
            ) {

              return;
            }


            // =================================================
            // فلترة الدوري
            // =================================================

            if (
              !allowedLeague(
                item
              )
            ) {

              return;
            }


            const fixtureId =
              String(
                item.fixture.id
              );


            const status =
              item.fixture.status &&
              item.fixture.status.short
                ? item.fixture.status.short
                : '';


            console.log(
              `Saving ${fixtureId} | ${status}`
            );


            // =================================================
            // حفظ داخل matches فقط
            // =================================================

            await db
              .ref(
                `matches/${fixtureId}`
              )
              .set(
                item
              );


            console.log(
              `Saved matches/${fixtureId}`
            );
          }


          // =====================================================
          // حفظ مجموعة مباريات
          // =====================================================

          async function saveFixtures(
            data
          ) {

            if (
              !data ||
              !data.response
            ) {

              console.log(
                'No fixtures response'
              );

              return;
            }


            console.log(
              `Received ${data.response.length} fixtures`
            );


            for (
              const item
              of data.response
            ) {

              try {

                await saveFixture(
                  item
                );

              } catch (error) {

                console.log(
                  'SAVE ERROR'
                );

                console.log(
                  error.message
                );
              }
            }
          }


          // =====================================================
          // تنظيف العقد التالفة فقط
          // =====================================================

          async function cleanupInvalidMatches() {

            console.log(
              'Checking Firebase matches...'
            );


            const snapshot =
              await db
                .ref('matches')
                .once('value');


            const updates = {};


            snapshot.forEach(
              child => {

                const item =
                  child.val();


                if (
                  !item ||
                  !item.fixture ||
                  !item.fixture.id
                ) {

                  updates[
                    `matches/${child.key}`
                  ] = null;

                  console.log(
                    `Removed invalid: ${child.key}`
                  );
                }

              }
            );


            if (
              Object.keys(updates).length > 0
            ) {

              await db
                .ref()
                .update(
                  updates
                );

            } else {

              console.log(
                'No invalid matches found'
              );
            }
          }


          // =====================================================
          // المزامنة الرئيسية
          // =====================================================

          async function sync() {

            try {

              console.log(
                '======================================'
              );

              console.log(
                'FOOTBALL SYNC START'
              );

              console.log(
                '======================================'
              );


              // =================================================
              // تاريخ بغداد
              // =================================================

              const today =
                getBaghdadDate();


              const yesterday =
                addDays(
                  today,
                  -1
                );


              const tomorrow =
                addDays(
                  today,
                  1
                );


              const hour =
                getBaghdadHour();


              console.log(
                `Yesterday: ${yesterday}`
              );

              console.log(
                `Today: ${today}`
              );

              console.log(
                `Tomorrow: ${tomorrow}`
              );

              console.log(
                `Baghdad Hour: ${hour}`
              );


              // =================================================
              // الطلب الرئيسي
              //
              // هذا يحدث:
              // - المباريات القادمة
              // - المباريات المباشرة
              // - النتائج
              // - الحالات
              //
              // لأن API-Football يعيد حالة المباراة الحالية.
              // =================================================

              const todayData =
                await fetchAPI(
                  `${API_BASE}/fixtures?date=${today}&timezone=${TIMEZONE}`
                );


              await saveFixtures(
                todayData
              );


              // =================================================
              // مرة واحدة يوميًا
              //
              // نجلب:
              // - الأمس
              // - الغد
              //
              // لتقليل استهلاك API.
              //
              // الساعة 00:00 - 00:59 بتوقيت بغداد.
              // =================================================

              if (
                hour === 0
              ) {

                console.log(
                  'DAILY UPDATE START'
                );


                // =============================================
                // الأمس
                // =============================================

                const yesterdayData =
                  await fetchAPI(
                    `${API_BASE}/fixtures?date=${yesterday}&timezone=${TIMEZONE}`
                  );


                await saveFixtures(
                  yesterdayData
                );


                // =============================================
                // الغد
                // =============================================

                const tomorrowData =
                  await fetchAPI(
                    `${API_BASE}/fixtures?date=${tomorrow}&timezone=${TIMEZONE}`
                  );


                await saveFixtures(
                  tomorrowData
                );


                console.log(
                  'DAILY UPDATE COMPLETED'
                );
              }


              // =================================================
              // تنظيف البيانات التالفة
              // =================================================

              await cleanupInvalidMatches();


              console.log(
                '======================================'
              );

              console.log(
                'SYNC COMPLETED'
              );

              console.log(
                '======================================'
              );


              process.exit(
                0
              );

            } catch (error) {

              console.error(
                '======================================'
              );

              console.error(
                'SYNC ERROR'
              );

              console.error(
                error.message
              );

              console.error(
                '======================================'
              );


              process.exit(
                1
              );
            }
          }


          // =====================================================
          // START
          // =====================================================

          sync();

          EOF


      - name: Run Sync
        env:

          API_FOOTBALL_KEY:
            ${{ secrets.API_FOOTBALL_KEY }}

          FIREBASE_DATABASE_URL:
            ${{ secrets.FIREBASE_DATABASE_URL }}

          FIREBASE_SERVICE_ACCOUNT:
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          node sync.js
