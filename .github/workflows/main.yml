name: Test Bzzoiro JSON

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Bzzoiro JSON
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          node <<'NODE'
          const https = require('https');

          const API_KEY = process.env.BZZOIRO_API_KEY;

          if (!API_KEY) {
            console.error("❌ BZZOIRO_API_KEY غير موجود");
            process.exit(1);
          }

          const today = new Date().toISOString().substring(0, 10);

          function request(path) {
            return new Promise((resolve, reject) => {

              const options = {
                hostname: 'sports.bzzoiro.com',
                path: path,
                method: 'GET',
                headers: {
                  'Authorization': `Token ${API_KEY}`,
                  'Accept': 'application/json'
                }
              };

              const req = https.request(options, res => {

                let data = '';

                res.on('data', chunk => {
                  data += chunk;
                });

                res.on('end', () => {

                  console.log(`HTTP ${res.statusCode}`);

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    console.log(data.substring(0, 3000));
                    reject(
                      new Error(`HTTP ${res.statusCode}`)
                    );
                    return;
                  }

                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    console.log(data.substring(0, 3000));
                    reject(e);
                  }

                });

              });

              req.on('error', reject);

              req.end();
            });
          }

          function extractEvents(data) {

            if (Array.isArray(data)) {
              return data;
            }

            if (Array.isArray(data.results)) {
              return data.results;
            }

            if (Array.isArray(data.events)) {
              return data.events;
            }

            if (Array.isArray(data.data)) {
              return data.data;
            }

            return [];
          }

          (async () => {

            console.log("========================================");
            console.log(" BZZOIRO RAW JSON TEST");
            console.log("========================================");

            console.log(`التاريخ: ${today}`);

            const data = await request(
              `/api/v2/events/?date_from=${today}&date_to=${today}`
            );

            const events = extractEvents(data);

            console.log("");
            console.log(`عدد المباريات: ${events.length}`);

            if (events.length === 0) {
              console.log("❌ لا توجد مباريات اليوم");
              process.exit(1);
            }

            // أول مباراة
            const match = events[0];

            console.log("");
            console.log("========================================");
            console.log(" المباراة الأولى - RAW JSON");
            console.log("========================================");

            console.log(
              JSON.stringify(match, null, 2)
            );

            console.log("");
            console.log("========================================");
            console.log(" انتهى الاختبار");
            console.log("========================================");

          })().catch(error => {

            console.error("");
            console.error("❌ ERROR:");
            console.error(error.message);

            process.exit(1);

          });
          NODE
